<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arpatech Virtual Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef1e5;
            --surface: #ffffff;
            --surface-strong: #f5f6ef;
            --text: #1f2f21;
            --muted: #6a7b66;
            --accent: #3b8d4d;
            --accent-strong: #2f6d3a;
            --border: #d3d7cc;
            --error: #c0392b;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background: linear-gradient(180deg, #f5f6ef 0%, #eef1e5 100%);
            color: var(--text);
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .container {
            width: min(390px, 100%);
            display: grid;
            gap: 24px;
        }
        .card {
            background: #f8f8f8;
            border: 1px solid var(--border);
            border-radius: 28px;
            box-shadow: 0 22px 60px rgba(35, 57, 41, 0.12);
            overflow: hidden;
            width: 100%;
            min-width: 460px;
        }
        .header {
            background: #333;
            padding: 20px;
            display: flex;
            /* justify-content: space-between; */
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        img.back-home {
            width: 20px;
        }
        .chatbot-header-icon img.welcome-image {
            background: #BACE34;
            border-radius: 50px;
            padding: 10px;
            width: 45px;
            margin: 0 auto;
            display: block;
        }
        .right-side-icons {
            display: block;
            text-align: right;
            width: 150px;
        }
        .right-side-icons a img {
            width: 16px;
            margin-left: 5px;
        }
        .title {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            line-height: 1.05;
            color: #fff;
        }
        .subtitle {
            margin: 14px 0 0;
            max-width: 720px;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
        }
        .status-chip {
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(59, 141, 77, 0.12);
            color: var(--accent-strong);
            font-weight: 700;
            letter-spacing: 0.03em;
            white-space: nowrap;
            border: 1px solid rgba(59, 141, 77, 0.14);
        }
        .chat-frame {
            display: grid;
            grid-template-rows: 1fr auto;
            min-height: 560px;
            padding: 24px;
        }
        #welcomeFrame {
            padding: 10px;
        }
        img.welcome-image {
            background: #BACE34;
            border-radius: 50px;
            padding: 10px;
            width: 60px;
            margin: 0 auto 12px;
            display: block;
        }
        #welcomeFrame h2 {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            text-align: center;
            margin: 0;
        }
        #welcomeFrame p {
            font-size: 14px;
            color: #333333B3;
            text-align: center;
            margin-top: 12px;
        }
        #welcomeFrame ul {
            margin-top: 12px;
            padding: 0;
        }
        #welcomeFrame ul li {
            font-size: 14px;
            color: #333333CC;
            line-height: 25px;
            list-style: none;
        }
        .assist-btns a {
            display: flex;
            border: 1px solid #E5E7EB;
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
            margin-top: 12px;
        }
        .assist-btns img {
            width: 46px;
            background: #F8F9F4;
            border-radius: 14px;
            padding: 10px;
        }
        .assist-btns a:hover {
            box-shadow: 0 4px 6px -1px #0000001a,
            0 2px 4px -2px #0000001a;
            border-color: #bace34;
        }
        .assist-btns a:hover img {
            background: #bace34;
        }
        .chat-window {
            padding: 24px;
            overflow-y: auto;
            min-height: 420px;
            max-height: 70vh;
            background: #fbfcf6;
            color: #0f2415;
            border: 1px solid rgba(15, 36, 22, 0.12);
            border-radius: 24px;
        }
        .message {
            max-width: 90%;
            margin-bottom: 18px;
            padding: 18px 20px;
            border-radius: 24px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 0 0 1px rgba(15, 36, 22, 0.06);
        }
        .message.user {
            margin-left: auto;
            background: #e9f9e9;
            border-top-right-radius: 6px;
            color: #0f2415;
            border: 1px solid rgba(59, 141, 77, 0.14);
        }
        .message.bot {
            margin-right: auto;
            background: #ffffff;
            border-top-left-radius: 6px;
            color: #0f2415;
            border: 1px solid rgba(31, 47, 33, 0.08);
            max-width: 95%;
        }
        .author {
            display: block;
            margin-bottom: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            opacity: 0.82;
        }
        .input-panel {
            padding: 22px 24px 24px;
            border-top: 1px solid var(--border);
            display: grid;
            gap: 12px;
            background: var(--surface-strong);
        }
        .form-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .input-field {
            flex: 1 1 0;
            min-width: 0;
            padding: 16px 18px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: #ffffff;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .input-field::placeholder {
            color: rgba(79, 96, 73, 0.55);
        }
        .input-field:focus {
            border-color: rgba(59, 141, 77, 0.75);
            box-shadow: 0 0 0 4px rgba(59, 141, 77, 0.12);
        }
        .action-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .button {
            border: none;
            border-radius: 999px;
            padding: 14px 20px;
            font-weight: 700;
            letter-spacing: 0.01em;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }
        .button.primary {
            background: linear-gradient(135deg, #63a861, #3b8d4d);
            color: #ffffff;
            box-shadow: 0 18px 32px rgba(59, 141, 77, 0.22);
        }
        .button.secondary {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
        }
        .button:active {
            transform: translateY(1px);
        }
        .button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .helper {
            color: var(--muted);
            font-size: 0.94rem;
        }
        .error-banner {
            padding: 14px 18px;
            border-radius: 16px;
            background: rgba(197, 75, 75, 0.12);
            border: 1px solid rgba(197, 75, 75, 0.2);
            color: #ffe1e1;
            display: none;
        }
        .typing-bubble {
            max-width: 76%;
            margin-bottom: 18px;
            padding: 18px 20px;
            border-radius: 24px;
            border-top-left-radius: 6px;
            background: #ffffff;
            border: 1px solid rgba(31, 47, 33, 0.08);
            box-shadow: inset 0 0 0 1px rgba(15, 36, 22, 0.06);
        }
        .typing-label {
            display: block;
            margin-bottom: 8px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            opacity: 0.82;
        }
        .typing-dots {
            font-size: 1.2rem;
            letter-spacing: 1px;
            animation: typing 1.4s infinite;
        }
        @keyframes typing {
            0%, 60%, 100% {
                content: '';
            }
            30% {
                content: '.';
            }
            60% {
                content: '..';
            }
        }
        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #3b8d4d;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite;
        }
        .dot:nth-child(1) {
            animation-delay: 0s;
        }
        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 1;
            }
            30% {
                transform: translateY(-10px);
                opacity: 0.7;
            }
        }
        .markdown-content {
            line-height: 1.65;
        }
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            margin: 16px 0 8px;
            font-weight: 700;
            color: var(--accent-strong);
        }
        .markdown-content h1 {
            font-size: 1.5rem;
        }
        .markdown-content h2 {
            font-size: 1.3rem;
        }
        .markdown-content h3 {
            font-size: 1.1rem;
        }
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            font-size: 1rem;
        }
        .markdown-content p {
            margin: 8px 0;
        }
        .markdown-content ul,
        .markdown-content ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        .markdown-content li {
            margin: 6px 0;
        }
        .markdown-content strong {
            font-weight: 700;
            color: var(--accent-strong);
        }
        .markdown-content em {
            font-style: italic;
        }
        .markdown-content code {
            background: rgba(59, 141, 77, 0.12);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .markdown-content pre {
            background: rgba(15, 36, 22, 0.05);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        .markdown-content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            margin: 10px 0;
            opacity: 0.85;
        }
        .markdown-content a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(59, 141, 77, 0.3);
        }
        .markdown-content a:hover {
            border-bottom-color: var(--accent);
        }
        #chatLauncher {
            position: fixed;
            right: 20px;
            bottom: 20px;
            width: 50px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,0,0,.25);
        }

        #chatLauncher img {
            width: 120px;
        }

        .chat-container-main {
            display:none;
        }
        .welcome-input-panel{
            margin-top:20px;
        }

        .welcome-input-panel .form-row{
            display:flex;
            gap:10px;
        }

        .welcome-input-panel .input-field{
            flex:1;
        }
        @media (max-width: 760px) {
            .header {
                padding: 20px;
            }
            .chat-window {
                padding: 18px;
            }
            .input-panel {
                padding: 18px 20px 20px;
            }
        }
        @media (max-width: 430px){
            .right-side-icons {
                /* width: auto; */
            }
        }
    </style>
</head>
<body>
    <!-- Floating Chat Button -->
    <div id="chatLauncher">
        <img src="{{ url_for('static', filename='launcher-btn.png') }}" alt="Open Chat">
    </div>
    <div class="container chat-container-main">
        <section class="card">
            <div class="header">
                <div class="back-to-home">
                    <a href="#" id="backHome" style="display:none;">
                        <img src="{{ url_for('static', filename='back-home.png') }}" alt="Back to Home" class="back-home" />
                    </a>
                </div>
                <div class="chatbot-header-icon">
                    <img src="{{ url_for('static', filename='welcome-icon.png') }}" alt="Welcome" class="welcome-image" />
                </div>
                <div class="chatbot-header-inner">
                    <h1 class="title">Arpatech Virtual Assistant</h1>
                </div>
                <div class="right-side-icons">
                    <a href="#" id="minimize"><img src="{{ url_for('static', filename='minus-icon.png') }}" alt="Minimize" /></a>
                    <a href="#" id="close"><img src="{{ url_for('static', filename='cross-icon.png') }}" alt="Close" /></a>
                </div>
            </div>
            <div class="chat-frame">
                <div id="welcomeFrame">
                    <img src="{{ url_for('static', filename='welcome-icon.png') }}" alt="Welcome" class="welcome-image" />
                    <h2>Welcome to Arpatech 👋</h2>
                    <p>I'm your virtual assistant.</p>
                    <p>I can help you with:</p>

                    <ul>
                        <li>• Services Information</li>
                        <li>• Technical Support</li>
                        <li>• Contact Our Team</li>
                        <li>• General Inquiries</li>
                    </ul>
                    
                    <div class="assist-btns">
                        <a href="#" id="services">
                            <img src="{{ url_for('static', filename='services-icon.png') }}" alt="Our Services" /> Our Services
                        </a>
                        <a href="#" id="contactUs">
                            <img src="{{ url_for('static', filename='contact-icon.png') }}" alt="Welcome" /> Contact Us
                        </a>
                        <a href="#" id="support">
                            <img src="{{ url_for('static', filename='support-icon.png') }}" alt="Welcome" /> Support
                        </a>
                        <a href="#" id="talkToSales">
                            <img src="{{ url_for('static', filename='talk-to-sales-icon.png') }}" alt="Welcome" /> Talk to Sales
                        </a>
                    </div>

                    <!-- Direct Chat Input -->
                    <div class="welcome-input-panel">
                        <div class="form-row">
                            <input
                                id="welcomeInput"
                                class="input-field"
                                type="text"
                                placeholder="Type your message here..."
                            />
                            <button
                                id="welcomeSendButton"
                                class="button primary"
                                type="button"
                            >
                                Send
                            </button>
                        </div>
                    </div>
                </div>
                <div id="chatPanel" style="display:none;">
                    <div id="chat" class="chat-window" aria-live="polite" aria-label="Chat history"></div>
                    <div class="input-panel">
                        <div class="error-banner" id="errorBanner" role="alert"></div>
                        <div class="form-row">
                            <input id="input" class="input-field" type="text" autocomplete="off" placeholder="Type your message here..." />
                            <button id="sendButton" class="button primary" type="button">Send</button>
                        </div>
                        <div class="action-group">
                            <button id="clearButton" class="button secondary" type="button">Clear Chat</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        let chatAlreadyOpened = sessionStorage.getItem("chatOpened") === "true";
        let waitingForEmail = false;
        let waitingForPhone = false;
        const chatEl = document.getElementById("chat");
        const inputEl = document.getElementById("input");
        const sendButton = document.getElementById("sendButton");
        const clearButton = document.getElementById("clearButton");
        const errorBanner = document.getElementById("errorBanner");
        const backHome = document.getElementById("backHome");
        const container = document.querySelector(".chat-container-main");
        const chatLauncher = document.getElementById("chatLauncher");
        const closeBtn = document.getElementById("close");
        const minimizeBtn = document.getElementById("minimize");

        let currentTypingBubble = null;

        function formatMessage(author, content, type) {
            const wrapper = document.createElement("div");
            wrapper.className = `message ${type}`;

            const label = document.createElement("span");
            label.className = "author";
            label.textContent = author;

            const body = document.createElement("div");
            
            if (type === "bot") {
                body.className = "markdown-content";
                body.innerHTML = parseMarkdownWithCitations(content);
            } else {
                body.textContent = content;
            }

            wrapper.appendChild(label);
            wrapper.appendChild(body);
            return wrapper;
        }

        function createTypingBubble() {

            const textSpan = document.createElement("span");
            textSpan.style.marginLeft = "8px";
            textSpan.style.opacity = "0.8";
            textSpan.textContent = "Agent is typing";
        
            const wrapper = document.createElement("div");
            wrapper.className = "typing-bubble";

            const label = document.createElement("span");
            label.className = "typing-label";
            label.textContent = "Agent";

            const dotsContainer = document.createElement("div");
            dotsContainer.style.display = "flex";
            dotsContainer.style.alignItems = "center";

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement("div");
                dot.className = "dot";
                dotsContainer.appendChild(dot);
            }

            const contentDiv = document.createElement("div");
            contentDiv.style.display = "flex";
            contentDiv.style.alignItems = "center";
            contentDiv.style.gap = "4px";
            contentDiv.appendChild(dotsContainer);
            contentDiv.appendChild(textSpan);

            wrapper.appendChild(label);
            wrapper.appendChild(contentDiv);
            return wrapper;
        }

        function showTypingBubble() {
            if (currentTypingBubble) {
                currentTypingBubble.remove();
            }
            currentTypingBubble = createTypingBubble();
            chatEl.appendChild(currentTypingBubble);
            scrollToBottom();
        }

        function removeTypingBubble() {
            if (currentTypingBubble) {
                currentTypingBubble.remove();
                currentTypingBubble = null;
            }
        }

        function parseMarkdownWithCitations(text) {
            // Remove markdown citation definitions and numeric reference markers before rendering.
            text = text.replace(/\[\s*\d+\s*\]:.*(?:\r?\n|$)/gm, "");
            text = text.replace(/\[\s*\d+\s*\]/g, "");

            let html = marked.parse(text);
            // Remove link tags that only contain numeric citation text.
            html = html.replace(/<a[^>]*>\s*\d+\s*<\/a>/g, "");
            return html;
        }

        function showError(text) {
            errorBanner.textContent = text;
            errorBanner.style.display = "block";
        }

        function hideError() {
            errorBanner.style.display = "none";
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            inputEl.disabled = loading;
            clearButton.disabled = loading;
            sendButton.textContent = loading ? "Sending…" : "Send";
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function clearChat() {
            hideError();
            removeTypingBubble();
            setLoading(true);

            try {
                const response = await fetch("/reset", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || "Failed to reset chat.");
                }

                chatEl.innerHTML = "";
                if (chatEl.innerHTML.trim() === "") {
                    const botMsg = formatMessage("Agent", "Welcome back! How can I help you today?", "bot");
                    chatEl.appendChild(botMsg);
                }
                chatEl.appendChild(botMsg);
            } catch (error) {
                showError(error.message);
            } finally {
                setLoading(false);
                scrollToBottom();
                inputEl.focus();
            }
        }

        async function initializeAssistant() {
            setLoading(true);
            hideError();
            try {
                const response = await fetch("/init", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || "Failed to fetch initial greeting.");
                }

                const data = await response.json();
                const history = Array.isArray(data.history) ? data.history : [];

                if (history.length) {
                    history.forEach((item) => {
                        const role = item.role === "user" ? "You" : "Agent";
                        const type = item.role === "user" ? "user" : "bot";
                        const msg = formatMessage(role, item.message, type);
                        chatEl.appendChild(msg);
                    });
                } else if (data.cleared) {
                    const botMsg = formatMessage("Agent", "Welcome back! How can I help you today?", "bot");
                    chatEl.appendChild(botMsg);
                } else {
                    const greeting = data.response || "Hello! How can I help you today?";
                    const botMsg = formatMessage("Agent", greeting, "bot");
                    chatEl.appendChild(botMsg);
                }
            } catch (error) {
                showError(error.message);
                const botMsg = formatMessage("Agent", "Hi there — unable to load greeting. Please refresh or try again.", "bot");
                chatEl.appendChild(botMsg);
            } finally {
                setLoading(false);
                scrollToBottom();
                inputEl.focus();
            }
        }

        async function send() {
            hideError();
            const message = inputEl.value.trim();
            if (!message) {
                inputEl.focus();
                return;
            }

            //Email Validation
            if (waitingForEmail) {
                const emailRegex =
                    /^[A-Za-z0-9][A-Za-z0-9._%+-]*@[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$/;
                if (!emailRegex.test(message)) {
                    const botMsg = formatMessage(
                        "Agent",
                        "Please enter a valid email address.",
                        "bot"
                    );
                    chatEl.appendChild(botMsg);
                    scrollToBottom();
                    inputEl.focus();
                    return;
                }
            }

            //Phone Number Validation
            if (waitingForPhone) {
                if (!/^[0-9+-]+$/.test(message)) {
                    const botMsg = formatMessage(
                        "Agent",
                        "Please enter a valid mobile number.",
                        "bot"
                    );
                    chatEl.appendChild(botMsg);
                    scrollToBottom();
                    inputEl.focus();
                    return;
                }

                // Count only digits
                const digitCount = message.replace(/\D/g, "").length;
                if (digitCount < 11) {
                    const botMsg = formatMessage(
                        "Agent",
                        "Please enter a valid mobile number with at least 11 digits.",
                        "bot"
                    );
                    chatEl.appendChild(botMsg);
                    scrollToBottom();
                    inputEl.focus();
                    return;
                }
            }
            inputEl.addEventListener("input", function () {
                if (!waitingForPhone) return;

                let value = this.value;

                // Step 1: allow only digits and +
                value = value.replace(/[^0-9+]/g, "");

                // Step 2: keep only ONE +
                const hasPlus = value.includes("+");

                if (hasPlus) {
                    // remove all +
                    value = value.replace(/\+/g, "");

                    // add + back ONLY at start
                    value = "+" + value;
                }

                // Step 3: if user tries to put + anywhere else → auto remove
                if (value.indexOf("+") > 0) {
                    value = value.replace(/\+/g, "");
                }

                this.value = value;
            });

            // Client-side email validation: if input looks like an email but is invalid,
            // prompt the user immediately without sending to the server.
            const emailLike = message.includes("@") && message.length <= 254;
            const emailRegex = /^[A-Za-z0-9][A-Za-z0-9._%+-]*@[A-Za-z0-9][A-Za-z0-9.-]*\.[A-Za-z]{2,}$/;
            if (emailLike && !emailRegex.test(message)) {
                const userMsg = formatMessage("You", message, "user");
                chatEl.appendChild(userMsg);
                const botMsg = formatMessage("Agent", "Please enter a valid email.", "bot");
                chatEl.appendChild(botMsg);
                inputEl.value = "";
                scrollToBottom();
                inputEl.focus();
                return;
            }

            const userMsg = formatMessage("You", message, "user");
            chatEl.appendChild(userMsg);
            scrollToBottom();
            inputEl.value = "";
            setLoading(true);

            showTypingBubble();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });

                removeTypingBubble();

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || "Failed to fetch response.");
                }

                const data = await response.json();
                const reply = data.response || "No response returned.";

                //For Email and Phone Number Validation
                const lowerReply = reply.toLowerCase();

                if (
                    lowerReply.includes("please enter your email") ||
                    lowerReply.includes("please enter your email address")
                ) {
                    waitingForEmail = true;
                } else {
                    waitingForEmail = false;
                }

                if (
                    lowerReply.includes("please enter your mobile number") ||
                    lowerReply.includes("please enter your phone number") ||
                    lowerReply.includes("enter your contact number")
                ) {
                    waitingForPhone = true;
                } else {
                    waitingForPhone = false;
                }

                const botMsg = formatMessage("Agent", reply, "bot");

                const messageTop = chatEl.scrollHeight;

                chatEl.appendChild(botMsg);

                // Message ki shuru ki 2-3 lines nazar aayengi
                chatEl.scrollTop = messageTop - chatEl.clientHeight + 90;
            } catch (error) {
                removeTypingBubble();
                showError(error.message);
                const botMsg = formatMessage("Agent", "Sorry, something went wrong. Please try again.", "bot");
                chatEl.appendChild(botMsg);
            } finally {
                setLoading(false);
                // scrollToBottom();
                inputEl.focus();
            }
        }

        sendButton.addEventListener("click", send);
        clearButton.addEventListener("click", clearChat);
        inputEl.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                send();
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            inputEl.focus();
            // initializeAssistant();
        });

    //NEW JS
    document.addEventListener("DOMContentLoaded", function () {
        let initialized = false;

        const welcomeInput = document.getElementById("welcomeInput");
        const welcomeSendButton = document.getElementById("welcomeSendButton");

        async function sendFromWelcome() {
            const message = welcomeInput.value.trim();

            if (!message) return;

            welcomeFrame.style.display = "none";
            chatPanel.style.display = "block";
            backHome.style.display = "inline-flex";
            inputEl.value = message;
            welcomeInput.value = "";

            await send();
        }

        welcomeSendButton.addEventListener("click", sendFromWelcome);

        welcomeInput.addEventListener("keydown", async function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                await sendFromWelcome();
            }
        });

        chatLauncher.addEventListener("click", async function(e){
            e.preventDefault();

            container.style.display = "block";
            chatLauncher.style.display = "none";

            if(!chatAlreadyOpened){
                await initializeAssistant();
                chatAlreadyOpened = true;
                sessionStorage.setItem("chatOpened", "true");
            }

            if(!initialized){
                await initializeAssistant();
                initialized = true;
            }
        });

        closeBtn.addEventListener("click", async function(e){
            e.preventDefault();

            try{
                await clearChat();
            }catch(err){
                console.log(err);
            }

            // Reset UI
            chatPanel.style.display = "none";
            welcomeFrame.style.display = "block";
            backHome.style.display = "none";
            container.style.display = "none";
            chatLauncher.style.display = "flex";
            chatEl.innerHTML = "";

            initialized = false;
        });

        minimizeBtn.addEventListener("click", function(e){
            e.preventDefault();
            container.style.display = "none";
            chatLauncher.style.display = "flex";
        });

        const welcomeFrame = document.getElementById("welcomeFrame");
        const chatPanel = document.getElementById("chatPanel");
        // Initial state
        welcomeFrame.style.display = "block";
        chatPanel.style.display = "none";
        async function openChat(message) {
            // Hide welcome screen
            welcomeFrame.style.display = "none";
            // Show chat panel
            chatPanel.style.display = "block";
            backHome.style.display = "inline-flex";
            // Put message in input
            inputEl.value = message;
            // Send using existing function
            await send();
        }

        backHome.addEventListener("click", async function(e){
            e.preventDefault();

            // Chat reset
            await clearChat();

            // Chat panel hide
            chatPanel.style.display = "none";

            // Welcome screen show
            welcomeFrame.style.display = "block";

            // Home button hide
            backHome.style.display = "none";

            // Agar assistant dobara initialize karwana hai
            initialized = false;
        });

        const actions = {
            services: "What services does Arpatech provide?",
            contactUs: "Contact Us",
            support: "Connect me with someone at Arpatech",
            talkToSales: "Connect me with someone from the sales team at Arpatech"
        };

        Object.keys(actions).forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener("click", async function (e) {
                    e.preventDefault();
                    await openChat(actions[id]);
                });
            }
        });
    });
    </script>
